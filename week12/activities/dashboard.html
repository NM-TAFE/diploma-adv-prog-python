{% extends "base.html" %}
<!-- Reuse global layout if available -->

{% block content %}

<section>
    <h1>{{ page_title }}</h1>
    <!-- Display the title from context -->
    <p>{{ welcome_message }}</p>
    <!-- Show the welcome text -->
    <ul>
        {% for alert in active_alerts %}
        <li>{{ alert }}</li>
        <!-- Loop through alerts -->
        {% empty %}
        <li>No active alerts right now.</li>
        <!-- Fallback when list is empty -->
        {% endfor %}
    </ul>
</section>
{% endblock %}
